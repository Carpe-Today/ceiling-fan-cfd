<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Ceiling Fan CFD Simulation</title>
    <!-- <link rel="stylesheet" href="style.css"> --> <!-- Assuming style.css exists -->
    <!-- Script Imports (Ensure paths are correct relative to index.html) -->
    <script src="js/libs/three.min.js"></script>
    <script src="js/libs/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="fan_physics.js"></script>
    <script src="enhanced_particles.js"></script>
    <script src="enhanced_particle_update.js"></script>
    <script src="trail_effects.js"></script>
    <script src="advanced_effects.js"></script>
    <style>
        /* Basic styles - include essential ones here */
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #f0f0f0; }
        canvas { display: block; }
        #loading { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            font-size: 1.5em; 
            color: #333; 
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 8px;
            z-index: 100; /* Ensure it's on top */
        }
        .hidden { display: none; }
        #controls { /* Add basic positioning if needed */
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 5px;
            max-height: 90vh;
            overflow-y: auto;
            z-index: 10;
        }
        #controls-toggle { /* Basic positioning */
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 11;
            padding: 10px;
            cursor: pointer;
        }
        /* Add other essential styles if needed */
    </style>
</head>
<body>
    <script>console.log("HTML Body Start");</script> <!-- <<< LOG 1 -->

    <canvas id="simulation-canvas"></canvas>
    <div id="loading">Loading Simulation...</div>
    <!-- Basic Controls Structure (ensure IDs match JS) -->
    <div id="controls" class="hidden"> <!-- Start hidden if toggled -->
        <button class="close-controls">X</button>
        <div class="tabs">
            <button class="tab-button active" data-tab="room">Room</button>
            <button class="tab-button" data-tab="fan">Fan</button>
            <button class="tab-button" data-tab="viz">Viz</button>
             <button class="tab-button" data-tab="energy">Energy</button>
            <button class="tab-button" data-tab="metrics">Metrics</button>
        </div>
        <div id="room-tab" class="tab-content active">
            <label>Length: <input type="number" id="room-length" value="20" step="1"></label><br>
            <label>Width: <input type="number" id="room-width" value="15" step="1"></label><br>
            <label>Height: <input type="number" id="room-height" value="10" step="1"></label><br>
        </div>
        <div id="fan-tab" class="tab-content">
             <label>Diameter: <input type="number" id="fan-diameter" value="5" step="0.5"></label><br>
             <label>Blades: <input type="number" id="blade-count" value="3" step="1" min="2"></label><br>
             <label>RPM: <input type="number" id="fan-rpm" value="150" step="10"></label><br>
             <label>Power (W): <input type="number" id="fan-power" value="75" step="5"></label><br>
             <label>CFM: <input type="number" id="fan-cfm" value="5000" step="100"></label><br>
             <label>Height (Floor): <input type="number" id="fan-height" value="8" step="0.5"></label><br>
             <label>Downrod: <input type="number" id="downrod-length" value="1" step="0.25"></label><br>
             <label>Rotation: <select id="rotation-direction"><option value="down">Down</option><option value="up">Up</option></select></label><br>
             <label>Type: <select id="fan-type"><option value="standard">Standard</option></select></label><br>
        </div>
         <div id="viz-tab" class="tab-content">
            <label>Density: <select id="particle-density"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label><br>
            <label>Size: <input type="range" id="particle-size" min="0.5" max="2.0" step="0.1" value="1.0"></label><br>
            <label>Color: <select id="color-scheme"><option value="velocity">Velocity</option><option value="depth">Depth</option><option value="fixed">Fixed</option></select></label><br>
            <label>Trails: <input type="checkbox" id="show-trails"></label><br>
            <label>Heatmap: <input type="checkbox" id="show-heatmap"></label><br>
            <label>Turbulence: <input type="checkbox" id="show-turbulence"></label><br>
            <label>Vortex: <input type="checkbox" id="show-vortex"></label><br>
        </div>
        <div id="energy-tab" class="tab-content">
            <label>Cost ($/kWh): <input type="number" id="electricity-cost" value="0.15" step="0.01"></label><br>
            <label>Hours/Day: <input type="number" id="usage-hours" value="8" step="1"></label><br>
        </div>
        <div id="metrics-tab" class="tab-content">
            <p>Room Vol: <span id="room-volume">0</span> ft³</p>
            <p>Floor Area: <span id="floor-area">0</span> ft²</p>
            <p>Particle Count: <span id="particle-count">0</span></p>
            <p>Blade Spacing: <span id="blade-spacing">0</span> °</p>
            <p>Effective Area: <span id="effective-area">0</span> ft²</p>
            <p>Tip Speed: <span id="tip-speed">0</span> mph</p>
            <p>Efficiency: <span id="fan-efficiency">0</span> CFM/W</p>
            <p>Air Changes: <span id="air-changes">0</span> ACH</p>
            <p>Energy Use: <span id="energy-consumption">0</span> kWh/day</p>
            <p>Op Cost: $<span id="operating-cost">0.00</span> /day</p>
        </div>
        <button id="reset-simulation">Reset</button>
        <button id="export-report">Export PDF</button>
        <div>
            <button id="zoom-in">+</button>
            <button id="zoom-out">-</button>
            <button id="reset-view">Reset View</button>
        </div>
    </div>
    <button id="controls-toggle">☰</button>

    <script>
        console.log("Main Script Start"); // <<< LOG 2
        console.log("THREE object exists:", typeof THREE !== 'undefined'); // <<< LOG 3
        console.log("OrbitControls exists:", typeof THREE !== 'undefined' && typeof THREE.OrbitControls !== 'undefined'); // <<< LOG 4
        console.log("initializeFanPhysics exists:", typeof initializeFanPhysics !== 'undefined'); // <<< LOG 5
        console.log("createEnhancedParticles exists:", typeof createEnhancedParticles !== 'undefined'); // <<< LOG 6
        console.log("initializeTrails exists:", typeof initializeTrails !== 'undefined'); // <<< LOG 7
        console.log("createHeatMapVisualization exists:", typeof createHeatMapVisualization !== 'undefined'); // <<< LOG 8
        console.log("createTurbulenceVisualization exists:", typeof createTurbulenceVisualization !== 'undefined'); // <<< LOG 9
        console.log("createVortexVisualization exists:", typeof createVortexVisualization !== 'undefined'); // <<< LOG 10
        console.log("jspdf exists:", typeof jspdf !== 'undefined'); // <<< LOG 11
        console.log("html2canvas exists:", typeof html2canvas !== 'undefined'); // <<< LOG 12

        document.addEventListener("DOMContentLoaded", function() { // Wrap in DOMContentLoaded
            console.log("DOMContentLoaded event fired"); // <<< LOG 13
            try {
                // Global variables
                let scene, camera, renderer, orbitControls, room, fan, particles = [], blades = [], walls = [];
                let animationId;
                let lastUpdateTime = 0; 
                let isMobile = false;
                let trailObjects = { lines: [], materials: [] };
                let heatMaps = null;
                let turbulenceVisualization = null;
                let vortexVisualization = null;
                let fanPhysicsData = {};
                
                // DOM elements
                const canvas = document.getElementById("simulation-canvas");
                const controls = document.getElementById("controls");
                const controlsToggle = document.getElementById("controls-toggle");
                const closeControls = document.querySelector(".close-controls"); 
                const tabButtons = document.querySelectorAll(".tab-button");
                const tabContents = document.querySelectorAll(".tab-content");
                
                // Room inputs
                const roomLength = document.getElementById("room-length");
                const roomWidth = document.getElementById("room-width");
                const roomHeight = document.getElementById("room-height");
                const particleCountDisplay = document.getElementById("particle-count");
                
                // Fan inputs
                const fanDiameter = document.getElementById("fan-diameter");
                const bladeCount = document.getElementById("blade-count");
                const fanRPM = document.getElementById("fan-rpm");
                const fanPower = document.getElementById("fan-power");
                const fanCFM = document.getElementById("fan-cfm");
                const fanHeight = document.getElementById("fan-height");
                const downrodLength = document.getElementById("downrod-length");
                const rotationDirection = document.getElementById("rotation-direction");
                const fanType = document.getElementById("fan-type");
                
                // Energy inputs
                const electricityCost = document.getElementById("electricity-cost");
                const usageHours = document.getElementById("usage-hours");
                
                // Visualization inputs
                const particleDensity = document.getElementById("particle-density");
                const showTrails = document.getElementById("show-trails");
                const showHeatmap = document.getElementById("show-heatmap");
                const showTurbulence = document.getElementById("show-turbulence");
                const showVortex = document.getElementById("show-vortex");
                const colorScheme = document.getElementById("color-scheme");
                const particleSize = document.getElementById("particle-size");
                
                // Metrics outputs
                const roomVolume = document.getElementById("room-volume");
                const floorArea = document.getElementById("floor-area");
                const bladeSpacing = document.getElementById("blade-spacing");
                const effectiveArea = document.getElementById("effective-area");
                const energyConsumption = document.getElementById("energy-consumption");
                const operatingCost = document.getElementById("operating-cost");
                const tipSpeedDisplay = document.getElementById("tip-speed");
                const fanEfficiencyDisplay = document.getElementById("fan-efficiency");
                const airChangesDisplay = document.getElementById("air-changes");
                
                // Actions
                const exportReportButton = document.getElementById("export-report");
                const resetSimulationButton = document.getElementById("reset-simulation");
                
                // View Controls
                const zoomInButton = document.getElementById("zoom-in");
                const zoomOutButton = document.getElementById("zoom-out");
                const resetViewButton = document.getElementById("reset-view");
                
                // Loading Indicator
                const loadingIndicator = document.getElementById("loading");

                // Explicitly define loading functions with logs
                function showLoading() {
                    console.log("showLoading called");
                    if (loadingIndicator) {
                        loadingIndicator.classList.remove("hidden");
                    } else {
                        console.error("Loading indicator element not found!");
                    }
                }

                function hideLoading() {
                    console.log("hideLoading called");
                    if (loadingIndicator) {
                        loadingIndicator.classList.add("hidden");
                    } else {
                        console.error("Loading indicator element not found!");
                    }
                }
                
                // Initialize Three.js scene
                function init() {
                    console.log("init started"); // Log init start
                    showLoading();
                    
                    // Create scene
                    scene = new THREE.Scene();
                    scene.background = new THREE.Color(0xf0f0f0);
                    
                    // Create camera
                    const aspect = window.innerWidth / window.innerHeight;
                    camera = new THREE.PerspectiveCamera(60, aspect, 0.1, 1000);
                    camera.position.set(10, 5, 10);
                    
                    // Create renderer
                    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.shadowMap.enabled = true;
                    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                    
                    // Create controls - Check if OrbitControls exists
                    if (typeof THREE.OrbitControls === 'function') {
                        orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
                        orbitControls.enableDamping = true;
                        orbitControls.dampingFactor = 0.1;
                        orbitControls.screenSpacePanning = false;
                        orbitControls.maxPolarAngle = Math.PI;
                        orbitControls.minDistance = 2;
                        orbitControls.maxDistance = 50;
                    } else {
                        console.error("THREE.OrbitControls not loaded or not a constructor!");
                        alert("Error: 3D controls could not be initialized.");
                        hideLoading(); 
                        console.log("init aborted due to OrbitControls error"); 
                        return; 
                    }
                    
                    // Create lights
                    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
                    scene.add(ambientLight);
                    
                    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
                    directionalLight.position.set(5, 10, 7.5);
                    directionalLight.castShadow = true;
                    directionalLight.shadow.mapSize.width = 1024;
                    directionalLight.shadow.mapSize.height = 1024;
                    directionalLight.shadow.camera.near = 0.5;
                    directionalLight.shadow.camera.far = 50;
                    directionalLight.shadow.bias = -0.001;
                    directionalLight.shadow.radius = 2;
                    scene.add(directionalLight);
                    
                    // Initialize Fan Physics
                    fanPhysicsData = initializeFanPhysics();
                    
                    // Create initial room, fan, and particles
                    createRoom();
                    createFan(); 
                    const simParams = getSimulationParameters(); 
                    isMobile = window.innerWidth < 768; 
                    particles = createEnhancedParticles(scene, simParams, isMobile); 
                    trailObjects = initializeTrails(scene, particles); 
                    heatMaps = createHeatMapVisualization(scene, simParams); 
                    turbulenceVisualization = createTurbulenceVisualization(scene); 
                    vortexVisualization = createVortexVisualization(scene); 
                    
                    // Initialize UI
                    initUI();
                    
                    // Start animation loop
                    animate();
                    
                    // Initial metrics update
                    updateMetrics();
                    
                    // Check if mobile
                    isMobile = window.innerWidth < 768;
                    
                    // Add window resize handler
                    window.addEventListener("resize", onWindowResize);
                    
                    hideLoading();
                    console.log("init finished successfully"); // Log init finish
                }
                
                function animate(time) {
                    animationId = requestAnimationFrame(animate);
                    
                    if (lastUpdateTime === 0) {
                        lastUpdateTime = time; 
                    }
                    const deltaTime = (time - lastUpdateTime) / 1000;
                    lastUpdateTime = time; 
                    
                    const limitedDelta = isFinite(deltaTime) ? Math.max(0, Math.min(deltaTime, 1/30)) : 1/60; 
                    
                    if (orbitControls) orbitControls.update();
                    
                    const simParams = getSimulationParameters(); 
                    
                    applyFanPhysics(fan, fanPhysicsData, simParams, limitedDelta); 
                    
                    updateEnhancedParticles(particles, simParams, isMobile, limitedDelta); 
                                    
                    if (simParams.showTrails) {
                        updateTrails(particles, trailObjects, simParams, isMobile); 
                    }
                    
                    if (simParams.showHeatmap && heatMaps) {
                        updateHeatMaps(heatMaps, particles, simParams); 
                    }
                    
                    if (simParams.showTurbulence && turbulenceVisualization) {
                        updateTurbulenceVisualization(turbulenceVisualization, particles, isMobile); 
                    }
                    
                    if (simParams.showVortex && vortexVisualization) {
                        updateVortexVisualization(vortexVisualization, fan, particles, simParams, isMobile); 
                    }
                    
                    updateParticleSizes(particles, simParams, isMobile); 
                    
                    addPulsingEffect(particles, isMobile); 
                    
                    updateParticleColorsBasedOnScheme(particles, simParams); 
                    
                    renderer.render(scene, camera);
                }
                
                // Create room
                function createRoom() {
                    if (room) {
                        scene.remove(room);
                        walls = [];
                    }
                    room = new THREE.Group();
                    const params = getSimulationParameters();
                    const floorGeometry = new THREE.PlaneGeometry(params.roomWidth, params.roomLength);
                    const floorMaterial = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.8, metalness: 0.1 });
                    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
                    floor.rotation.x = -Math.PI / 2;
                    floor.receiveShadow = true;
                    room.add(floor);
                    const ceilingGeometry = new THREE.PlaneGeometry(params.roomWidth, params.roomLength);
                    const ceilingMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7, metalness: 0.1 });
                    const ceiling = new THREE.Mesh(ceilingGeometry, ceilingMaterial);
                    ceiling.rotation.x = Math.PI / 2;
                    ceiling.position.y = params.roomHeight;
                    ceiling.receiveShadow = true;
                    room.add(ceiling);
                    const wallMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
                    const wall1Geometry = new THREE.PlaneGeometry(params.roomWidth, params.roomHeight);
                    const wall1 = new THREE.Mesh(wall1Geometry, wallMaterial);
                    wall1.position.z = -params.roomLength / 2;
                    wall1.position.y = params.roomHeight / 2;
                    wall1.receiveShadow = true;
                    room.add(wall1);
                    walls.push(wall1);
                    const wall2Geometry = new THREE.PlaneGeometry(params.roomWidth, params.roomHeight);
                    const wall2 = new THREE.Mesh(wall2Geometry, wallMaterial);
                    wall2.position.z = params.roomLength / 2;
                    wall2.position.y = params.roomHeight / 2;
                    wall2.rotation.y = Math.PI;
                    wall2.receiveShadow = true;
                    room.add(wall2);
                    walls.push(wall2);
                    const wall3Geometry = new THREE.PlaneGeometry(params.roomLength, params.roomHeight);
                    const wall3 = new THREE.Mesh(wall3Geometry, wallMaterial);
                    wall3.position.x = -params.roomWidth / 2;
                    wall3.position.y = params.roomHeight / 2;
                    wall3.rotation.y = Math.PI / 2;
                    wall3.receiveShadow = true;
                    room.add(wall3);
                    walls.push(wall3);
                    const wall4Geometry = new THREE.PlaneGeometry(params.roomLength, params.roomHeight);
                    const wall4 = new THREE.Mesh(wall4Geometry, wallMaterial);
                    wall4.position.x = params.roomWidth / 2;
                    wall4.position.y = params.roomHeight / 2;
                    wall4.rotation.y = -Math.PI / 2;
                    wall4.receiveShadow = true;
                    room.add(wall4);
                    walls.push(wall4);
                    scene.add(room);
                }
                
                // Create fan
                function createFan() {
                    if (fan) {
                        scene.remove(fan);
                        blades = [];
                    }
                    const params = getSimulationParameters();
                    fan = createFanModel(params); 
                    scene.add(fan);
                    const bladeGroup = fan.getObjectByName("bladeGroup");
                    if (bladeGroup) {
                        blades = bladeGroup.children;
                    }
                    const spacing = 360 / params.bladeCount;
                    bladeSpacing.textContent = spacing.toFixed(1);
                    const area = Math.PI * Math.pow(params.fanDiameter / 2, 2);
                    effectiveArea.textContent = area.toFixed(1);
                }
                
                // Get current simulation parameters from UI
                function getSimulationParameters() {
                    let particleCountValue;
                    switch(particleDensity.value) {
                        case "low": particleCountValue = 2000; break;
                        case "medium": particleCountValue = 5000; break;
                        case "high": particleCountValue = 8000; break;
                        default: particleCountValue = 5000;
                    }
                    return {
                        roomLength: parseFloat(roomLength.value),
                        roomWidth: parseFloat(roomWidth.value),
                        roomHeight: parseFloat(roomHeight.value),
                        fanDiameter: parseFloat(fanDiameter.value),
                        bladeCount: parseInt(bladeCount.value),
                        fanRPM: parseFloat(fanRPM.value),
                        fanPower: parseFloat(fanPower.value),
                        fanCFM: parseFloat(fanCFM.value),
                        fanHeight: parseFloat(fanHeight.value),
                        downrodLength: parseFloat(downrodLength.value),
                        rotationDirection: rotationDirection.value,
                        fanType: fanType.value,
                        particleCount: particleCountValue,
                        particleSize: parseFloat(particleSize.value),
                        colorScheme: colorScheme.value,
                        showTrails: showTrails.checked,
                        showHeatmap: showHeatmap.checked,
                        showTurbulence: showTurbulence.checked,
                        showVortex: showVortex.checked,
                        electricityCost: parseFloat(electricityCost.value),
                        usageHours: parseFloat(usageHours.value)
                    };
                }
                
                // Reset simulation state
                function resetSimulation() {
                    showLoading();
                    camera.position.set(10, 5, 10);
                    if (orbitControls) orbitControls.reset();
                    createRoom();
                    createFan();
                    particles.forEach(p => scene.remove(p));
                    trailObjects = cleanupTrails(scene, trailObjects); 
                    if (heatMaps) {
                        scene.remove(heatMaps.floorHeatMap);
                        scene.remove(heatMaps.ceilingHeatMap);
                        heatMaps.floorHeatMap.geometry.dispose();
                        heatMaps.floorHeatMap.material.dispose();
                        heatMaps.ceilingHeatMap.geometry.dispose();
                        heatMaps.ceilingHeatMap.material.dispose();
                    }
                    const simParams = getSimulationParameters(); 
                    isMobile = window.innerWidth < 768; 
                    particles = createEnhancedParticles(scene, simParams, isMobile); 
                    trailObjects = initializeTrails(scene, particles); 
                    heatMaps = createHeatMapVisualization(scene, simParams); 
                    turbulenceVisualization = createTurbulenceVisualization(scene); 
                    vortexVisualization = createVortexVisualization(scene); 
                    updateMetrics();
                    hideLoading();
                }
                
                // Initialize UI event listeners
                function initUI() {
                    controlsToggle.addEventListener("click", () => controls.classList.toggle("hidden")); // Toggle class
                    closeControls.addEventListener("click", () => controls.classList.add("hidden")); // Ensure close hides it
                    
                    tabButtons.forEach(button => {
                        button.addEventListener("click", function() {
                            const tab = this.dataset.tab;
                            tabButtons.forEach(btn => btn.classList.remove("active"));
                            tabContents.forEach(content => content.classList.remove("active"));
                            this.classList.add("active");
                            document.getElementById(tab + "-tab").classList.add("active");
                        });
                    });
                    
                    document.querySelectorAll(".value-button").forEach(button => {
                        button.addEventListener("click", function() {
                            const input = this.parentElement.querySelector("input");
                            const step = input.step ? parseFloat(input.step) : 1;
                            const min = input.min ? parseFloat(input.min) : -Infinity;
                            const max = input.max ? parseFloat(input.max) : Infinity;
                            let value = parseFloat(input.value);
                            if (this.classList.contains("plus")) {
                                value = Math.min(max, value + step);
                            } else {
                                value = Math.max(min, value - step);
                            }
                            input.value = value.toFixed(input.step && input.step.includes(".") ? input.step.split(".")[1].length : 0);
                            input.dispatchEvent(new Event("change"));
                        });
                    });
                    
                    [roomLength, roomWidth, roomHeight].forEach(input => {
                        input.addEventListener("change", () => {
                            showLoading();
                            createRoom();
                            createFan(); 
                            const simParams = getSimulationParameters(); 
                            isMobile = window.innerWidth < 768; 
                            particles = createEnhancedParticles(scene, simParams, isMobile); 
                            trailObjects = initializeTrails(scene, particles);
                            heatMaps = createHeatMapVisualization(scene, simParams); 
                            updateMetrics();
                            hideLoading();
                        });
                    });
                    
                    [fanDiameter, bladeCount, fanHeight, downrodLength, fanType].forEach(input => {
                        input.addEventListener("change", () => {
                            showLoading();
                            createFan();
                            const simParams = getSimulationParameters(); 
                            isMobile = window.innerWidth < 768; 
                            particles = createEnhancedParticles(scene, simParams, isMobile); 
                            trailObjects = initializeTrails(scene, particles);
                            updateMetrics();
                            hideLoading();
                        });
                    });
                    
                    [fanRPM, fanPower, fanCFM, rotationDirection].forEach(input => {
                        input.addEventListener("change", updateMetrics);
                    });
                    
                    particleDensity.addEventListener("change", () => {
                        showLoading();
                        const simParams = getSimulationParameters(); 
                        isMobile = window.innerWidth < 768; 
                        particles = createEnhancedParticles(scene, simParams, isMobile); 
                        trailObjects = initializeTrails(scene, particles);
                        updateMetrics(); 
                        hideLoading();
                    });
                    
                    showTrails.addEventListener("change", function() {
                        trailObjects.lines.forEach(line => line.visible = this.checked);
                    });
                    
                    showHeatmap.addEventListener("change", function() {
                        if (heatMaps) {
                            heatMaps.floorHeatMap.visible = this.checked;
                            heatMaps.ceilingHeatMap.visible = this.checked;
                        }
                    });
                    
                    showTurbulence.addEventListener("change", function() {
                        if (turbulenceVisualization) {
                            turbulenceVisualization.visible = this.checked;
                        }
                    });
                    
                    showVortex.addEventListener("change", function() {
                        if (vortexVisualization) {
                            vortexVisualization.visible = this.checked;
                        }
                    });
                    
                    colorScheme.addEventListener("change", () => {
                        updateParticleColorsBasedOnScheme(particles, getSimulationParameters());
                    });
                    
                    particleSize.addEventListener("change", () => {
                        const simParams = getSimulationParameters(); 
                        isMobile = window.innerWidth < 768; 
                        updateParticleSizes(particles, simParams, isMobile); 
                    });
                    
                    [electricityCost, usageHours].forEach(input => {
                        input.addEventListener("change", updateMetrics);
                    });
                    
                    exportReportButton.addEventListener("click", exportReport);
                    resetSimulationButton.addEventListener("click", resetSimulation);
                    
                    zoomInButton.addEventListener("click", () => orbitControls?.dollyOut(1.2));
                    zoomOutButton.addEventListener("click", () => orbitControls?.dollyIn(1.2));
                    resetViewButton.addEventListener("click", () => {
                        camera.position.set(10, 5, 10);
                        if (orbitControls) {
                            orbitControls.target.set(0, getSimulationParameters().roomHeight / 2, 0);
                            orbitControls.update();
                        }
                    });
                }
                
                // Handle window resize
                function onWindowResize() {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    isMobile = window.innerWidth < 768;
                }
                
                // Update metrics display
                function updateMetrics() {
                    const params = getSimulationParameters();
                    const volumeValue = params.roomLength * params.roomWidth * params.roomHeight;
                    const areaValue = params.roomLength * params.roomWidth;
                    roomVolume.textContent = volumeValue.toFixed(0);
                    floorArea.textContent = areaValue.toFixed(0);
                    particleCountDisplay.textContent = params.particleCount;
                    const spacing = 360 / params.bladeCount;
                    bladeSpacing.textContent = spacing.toFixed(1);
                    const effectiveFanArea = Math.PI * Math.pow(params.fanDiameter / 2, 2);
                    effectiveArea.textContent = effectiveFanArea.toFixed(1);
                    const tipSpeedFPS = (params.fanRPM * Math.PI * params.fanDiameter) / 60;
                    const tipSpeedMPH = tipSpeedFPS * (3600 / 5280);
                    tipSpeedDisplay.textContent = tipSpeedMPH.toFixed(1);
                    const efficiency = params.fanPower > 0 ? params.fanCFM / params.fanPower : 0;
                    fanEfficiencyDisplay.textContent = efficiency.toFixed(1);
                    const airChanges = volumeValue > 0 ? (params.fanCFM * 60) / volumeValue : 0;
                    airChangesDisplay.textContent = airChanges.toFixed(1);
                    const consumption = (params.fanPower / 1000) * params.usageHours;
                    const totalCost = consumption * params.electricityCost;
                    energyConsumption.textContent = consumption.toFixed(2);
                    operatingCost.textContent = totalCost.toFixed(2);
                }
                
                // Export report
                function exportReport() {
                    console.log("Exporting report...");
                    showLoading();
                    try {
                        setTimeout(() => {
                            try {
                                if (typeof jspdf === "undefined" || typeof html2canvas === "undefined") {
                                    console.error("jsPDF or html2canvas library not loaded!");
                                    alert("Error: Required libraries for PDF export are not loaded. Please wait a moment and try again.");
                                    hideLoading();
                                    return;
                                }
                                const { jsPDF } = jspdf; 
                                const doc = new jsPDF();
                                const params = getSimulationParameters();
                                doc.setFontSize(18);
                                doc.text("Enhanced Ceiling Fan CFD Simulation Report", 10, 20);
                                doc.setFontSize(10);
                                doc.text(`Generated: ${new Date().toLocaleString()}`, 10, 28);
                                doc.setFontSize(12);
                                doc.text("Simulation Parameters:", 10, 40);
                                doc.setFontSize(10);
                                doc.text(`Room Dimensions: ${params.roomLength}L x ${params.roomWidth}W x ${params.roomHeight}H`, 15, 48);
                                doc.text(`Fan Type: ${params.fanType}`, 15, 54);
                                doc.text(`Fan Diameter: ${params.fanDiameter} ft`, 15, 60);
                                doc.text(`Blade Count: ${params.bladeCount}`, 15, 66);
                                doc.text(`Fan RPM: ${params.fanRPM}`, 15, 72);
                                doc.text(`Fan Power: ${params.fanPower} W`, 15, 78);
                                doc.text(`Fan CFM: ${params.fanCFM}`, 15, 84);
                                doc.text(`Fan Height from Floor: ${params.fanHeight} ft`, 15, 90);
                                doc.text(`Rotation Direction: ${params.rotationDirection}`, 15, 96);
                                doc.setFontSize(12);
                                doc.text("Visualization Settings:", 10, 106);
                                doc.setFontSize(10);
                                doc.text(`Particle Density: ${particleDensity.value} (${params.particleCount} particles)`, 15, 114);
                                doc.text(`Particle Size: ${params.particleSize}`, 15, 120);
                                doc.text(`Color Scheme: ${params.colorScheme}`, 15, 126);
                                doc.text(`Show Trails: ${params.showTrails ? 'Yes' : 'No'}`, 15, 132);
                                doc.text(`Show Heatmap: ${params.showHeatmap ? 'Yes' : 'No'}`, 15, 138);
                                doc.text(`Show Turbulence: ${params.showTurbulence ? 'Yes' : 'No'}`, 15, 144);
                                doc.text(`Show Vortex: ${params.showVortex ? 'Yes' : 'No'}`, 15, 150);
                                doc.setFontSize(12);
                                doc.text("Energy Metrics:", 10, 160);
                                doc.setFontSize(10);
                                doc.text(`Electricity Cost: $${params.electricityCost.toFixed(2)} / kWh`, 15, 168);
                                doc.text(`Usage Hours: ${params.usageHours} hours`, 15, 174);
                                doc.text(`Energy Consumption: ${energyConsumption.textContent} kWh`, 15, 180);
                                doc.text(`Operating Cost: $${operatingCost.textContent}`, 15, 186);
                                doc.setFontSize(12);
                                doc.text("Performance Metrics:", 10, 196);
                                doc.setFontSize(10);
                                doc.text(`Tip Speed: ${tipSpeedDisplay.textContent} mph`, 15, 204);
                                doc.text(`Efficiency: ${fanEfficiencyDisplay.textContent} CFM/Watt`, 15, 210);
                                doc.text(`Air Changes per Hour: ${airChangesDisplay.textContent} ACH`, 15, 216);
                                doc.addPage();
                                doc.setFontSize(12);
                                doc.text("Simulation Screenshot:", 10, 20);
                                html2canvas(canvas, { useCORS: true }).then(canvasImg => {
                                    const imgData = canvasImg.toDataURL('image/png');
                                    const imgProps = doc.getImageProperties(imgData);
                                    const pdfWidth = doc.internal.pageSize.getWidth() - 20;
                                    const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
                                    doc.addImage(imgData, 'PNG', 10, 30, pdfWidth, pdfHeight);
                                    doc.save('ceiling_fan_cfd_report.pdf');
                                    console.log("Report exported successfully.");
                                    hideLoading();
                                }).catch(err => {
                                    console.error("Error generating screenshot:", err);
                                    alert("Error generating screenshot for the report.");
                                    doc.save('ceiling_fan_cfd_report_no_screenshot.pdf');
                                    console.log("Report exported without screenshot.");
                                    hideLoading();
                                });
                            } catch (e) {
                                console.error("Error during PDF generation:", e);
                                alert("An error occurred while generating the PDF report.");
                                hideLoading();
                            }
                        }, 100); 
                    } catch (e) {
                        console.error("Error setting up report export:", e);
                        alert("An error occurred before starting the report export.");
                        hideLoading();
                    }
                }
                
                // Call init function to start the simulation
                console.log("Calling init()..."); // <<< LOG 14
                init();
                console.log("init() call finished."); // <<< LOG 15

            } catch (error) {
                console.error("Critical error during script execution:", error); // <<< LOG 16
                alert("A critical error occurred. Please check the console.");
                // Try to show loading indicator if possible
                try {
                    const loadingElem = document.getElementById("loading");
                    if (loadingElem) {
                        loadingElem.textContent = "Error loading simulation. Check console.";
                        loadingElem.classList.remove("hidden");
                    }
                } catch (e) { /* Ignore */ }
            }
        });
    </script>
</body>
</html>
